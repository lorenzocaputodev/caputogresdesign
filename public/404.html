<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#E8E7E3" />
  <title>Pagina non trovata — Caputo Gres Design</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 40rem; min-height: 100svh; margin: 0 auto;
      display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1.4rem;
      padding: 2rem 1.25rem;
      background: #e8e7e3; color: #1e2428;
      font-family: system-ui, sans-serif; line-height: 1.55;
    }
    h1 { margin: 0; max-width: 14ch; font-size: clamp(2.3rem, 8vw, 4.5rem); font-weight: 800; line-height: 0.95; letter-spacing: -0.02em; }
    p { margin: 0; max-width: 36ch; font-size: 1.125rem; color: rgb(30 36 40 / 0.72); }
    a {
      display: inline-flex; align-items: center; min-height: 3rem; padding: 0.8rem 1.4rem;
      background: #1f6a6e; color: #fff; border-radius: 999px;
      font-weight: 650; text-decoration: none; transition: background-color 0.2s;
    }
    a:hover { background: #1e2428; }
    a:focus-visible { outline: 3px solid #1f6a6e; outline-offset: 3px; }
  </style>
</head>
<body>
  <h1>Pagina non trovata</h1>
  <p>L'indirizzo non esiste o è cambiato. I lavori e i contatti sono sulla pagina principale.</p>
  <a href="/">Torna alla home</a>
</body>
</html>
